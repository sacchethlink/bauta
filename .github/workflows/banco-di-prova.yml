name: Banco di prova

on:
  push:
    branches: [main]
    paths: ['index.html', 'banco-di-prova/**', '.github/workflows/banco-di-prova.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # ogni lunedì mattina

permissions:
  contents: write

jobs:
  misura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test del motore
        run: node test/test-motore.js
      - name: Scarica i testi italiani del banco di prova
        run: |
          pip install --quiet huggingface_hub pandas pyarrow
          python banco-di-prova/scarica.py
      - name: Misura
        run: node banco-di-prova/misura.js banco-di-prova/dati.jsonl
      - name: Esempi non coperti (ramo di lavoro banco-esempi, non nel ramo principale)
        run: |
          cp banco-di-prova/esempi-mancati.txt /tmp/esempi.txt
          git config user.name "Banco di prova"
          git config user.email "actions@users.noreply.github.com"
          git fetch --depth=1 origin banco-esempi || true
          git worktree add --detach /tmp/es
          cd /tmp/es && git checkout --orphan banco-esempi-tmp && git rm -rfq . && cp /tmp/esempi.txt esempi-mancati.txt
          printf 'Esempi sintetici dal dataset ai4privacy/open-pii-masking-500k-ai4privacy (CC BY 4.0), usati solo per migliorare Bauta.\n' > LEGGIMI.txt
          git add esempi-mancati.txt LEGGIMI.txt && git commit -qm "Esempi non coperti" && git push -f origin HEAD:banco-esempi
      - name: Salva i risultati nel repository
        run: |
          git config user.name "Banco di prova"
          git config user.email "actions@users.noreply.github.com"
          git add banco-di-prova/risultati.md
          git diff --cached --quiet || (git commit -m "Banco di prova: risultati aggiornati [skip ci]" && git push)
