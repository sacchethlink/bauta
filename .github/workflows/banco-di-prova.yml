name: Banco di prova

on:
  push:
    branches: [main]
    paths: ['index.html', 'banco-di-prova/**', '.github/workflows/banco-di-prova.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # ogni lunedì mattina

permissions:
  contents: write

jobs:
  misura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test del motore
        run: node test/test-motore.js
      - name: Scarica i testi italiani del banco di prova
        run: |
          pip install --quiet huggingface_hub pandas pyarrow
          python banco-di-prova/scarica.py
      - name: Misura
        run: node banco-di-prova/misura.js banco-di-prova/dati.jsonl
      - name: Esempi non coperti (per migliorare Bauta)
        uses: actions/upload-artifact@v4
        with:
          name: esempi-mancati
          path: banco-di-prova/esempi-mancati.txt
          retention-days: 7
      - name: Salva i risultati nel repository
        run: |
          git config user.name "Banco di prova"
          git config user.email "actions@users.noreply.github.com"
          git add banco-di-prova/risultati.md
          git diff --cached --quiet || (git commit -m "Banco di prova: risultati aggiornati [skip ci]" && git push)
